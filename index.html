<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPv4.pictures</title>
    <style>
        :root {
            --bg: #0b0e14;
            --panel: rgba(18, 22, 31, 0.86);
            --border: rgba(255, 255, 255, 0.09);
            --text: #e6e9ef;
            --muted: #8b93a4;
            --accent: #6aa7ff;
        }

        [hidden] { display: none !important; }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        #stage {
            position: fixed;
            inset: 0;
            touch-action: none;
            cursor: grab;
        }

        #stage.dragging { cursor: grabbing; }

        #gl, #labels {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #labels { pointer-events: none; }

        .panel {
            position: fixed;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        #controls {
            top: 16px;
            left: 16px;
            padding: 14px 16px;
            max-width: min(300px, calc(100vw - 64px));
        }

        #controls h1 {
            margin: 0 0 2px;
            font-size: 18px;
            letter-spacing: 0.01em;
        }

        #controls .sub {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 12px;
        }

        .seg {
            display: flex;
            gap: 2px;
            padding: 3px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        .seg button {
            flex: 1;
            padding: 6px 8px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 12.5px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .seg button:hover { color: var(--text); }

        .seg button[aria-pressed="true"] {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text);
        }

        #legend {
            margin-top: 12px;
            display: grid;
            gap: 4px;
            font-size: 12px;
            max-height: 40vh;
            overflow-y: auto;
        }

        #note {
            margin-top: 12px;
            font-size: 12px;
            color: var(--muted);
        }

        #note:empty { display: none; }
        #note + #legend { margin-top: 8px; }

        #meta {
            margin-top: 10px;
            font-size: 11px;
            color: var(--muted);
        }

        #meta a { color: inherit; }

        .row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .row .sw {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            flex: none;
        }

        .row .name { flex: 1; }
        .row .val { color: var(--muted); font-variant-numeric: tabular-nums; }

        #hint {
            top: 16px;
            right: 16px;
            padding: 8px 12px;
            font-size: 12px;
            color: var(--muted);
        }

        #timeline {
            left: 50%;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            width: min(620px, calc(100vw - 32px));
            box-sizing: border-box;
            padding: 10px 14px 8px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            column-gap: 12px;
        }

        #timeline[hidden] { display: none; }

        #play {
            width: 32px;
            height: 32px;
            border: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
            font-size: 12px;
            cursor: pointer;
            display: grid;
            place-items: center;
        }

        #play:hover, #speed:hover { background: rgba(255, 255, 255, 0.18); }

        #timeline .buttons { display: flex; gap: 6px; }

        #speed {
            height: 32px;
            min-width: 38px;
            padding: 0 8px;
            border: 0;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
            font: inherit;
            font-size: 12px;
            font-variant-numeric: tabular-nums;
            cursor: pointer;
        }

        .track { position: relative; }

        #marks {
            position: absolute;
            left: 0;
            right: 0;
            top: -9px;
            height: 8px;
        }

        #marks button {
            position: absolute;
            top: 0;
            width: 8px;
            height: 8px;
            margin-left: -4px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: #ffc15e;
            opacity: 0.75;
            cursor: pointer;
        }

        #marks button:hover { opacity: 1; transform: scale(1.4); }

        #time {
            width: 100%;
            margin: 0;
            accent-color: var(--accent);
            cursor: pointer;
        }

        #date {
            min-width: 7.5em;
            text-align: right;
            font-variant-numeric: tabular-nums;
            font-weight: 600;
        }

        #source {
            grid-column: 3;
            text-align: right;
            font-size: 10px;
            color: var(--muted);
            white-space: nowrap;
        }

        #years {
            grid-column: 2;
            position: relative;
            height: 14px;
            font-size: 10px;
            color: var(--muted);
        }

        #years span {
            position: absolute;
            transform: translateX(-50%);
        }

        #changes {
            top: 62px;
            right: 16px;
            width: min(300px, calc(100vw - 32px));
            box-sizing: border-box;
            max-height: calc(100vh - 62px - 110px);
            overflow-y: auto;
            padding: 12px 14px;
            font-size: 12px;
        }

        #changes .head { display: flex; align-items: center; gap: 8px; }
        #changes .tabs { display: flex; gap: 2px; flex: 1; }

        #changes .tabs button, #changes .collapse {
            padding: 4px 10px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        #changes .tabs button[aria-selected="true"] { background: rgba(255, 255, 255, 0.1); color: var(--text); }
        #changes .collapse { padding: 4px 8px; transition: transform 0.2s; }
        #changes.collapsed .collapse { transform: rotate(-90deg); }
        #changes.collapsed .since, #changes.collapsed .body, #changes.collapsed .events { display: none; }
        #changes .since { margin-top: 6px; color: var(--muted); }
        #changes .since:empty { display: none; }

        #changes .events table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        #changes .events td { padding: 6px 4px; vertical-align: top; border-top: 1px solid var(--border); }
        #changes .events tr { cursor: pointer; transition: opacity 0.2s; }
        #changes .events tr:hover td { background: rgba(255, 255, 255, 0.06); }
        #changes .events tr.future { opacity: 0.4; }
        #changes .events tr.now td { background: rgba(106, 167, 255, 0.16); }
        #changes .events .icon { width: 22px; font-size: 15px; line-height: 1.2; text-align: center; }
        #changes .events .when { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11px; padding-top: 8px; }
        #changes .events .what b { font-weight: 600; }

        #changes .events .detail {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: var(--muted);
            font-size: 11px;
        }

        #changes .event-now {
            display: flex;
            gap: 8px;
            align-items: baseline;
            padding: 6px 8px;
            border-radius: 6px;
            background: rgba(106, 167, 255, 0.16);
            cursor: pointer;
        }
        #changes .body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin-top: 8px; }
        #changes .muted { color: var(--muted); }
        #changes h3 {
            margin: 6px 0 0;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
        }

        #changes .note {
            padding: 6px 8px;
            border-radius: 6px;
            background: rgba(255, 193, 94, 0.1);
            color: #ffd899;
        }

        .tr {
            display: flex;
            align-items: center;
            gap: 5px;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* Faint outline so dark categories stay visible on the dark panels. */
        .sw { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14); }

        .tr > span:not(.sw) { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        .tr > span:last-child { flex-shrink: 0; max-width: 60%; } /* the destination shrinks last */

        .tr .sw {
            width: 9px;
            height: 9px;
            border-radius: 2px;
            flex: none;
        }

        #changes .range {
            display: grid;
            gap: 3px;
            width: 100%;
            padding: 6px 8px;
            border: 0;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.04);
            color: inherit;
            font: inherit;
            text-align: left;
            cursor: pointer;
        }

        #changes .range:hover { background: rgba(255, 255, 255, 0.1); }
        #changes .range .ip { flex: 1; font-variant-numeric: tabular-nums; }

        #tooltip {
            position: fixed;
            pointer-events: none;
            padding: 8px 10px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.12s;
            z-index: 10;
        }

        #tooltip b { font-size: 13px; }
        #tooltip .ip { color: var(--muted); font-variant-numeric: tabular-nums; }

        #loading {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            color: var(--muted);
            pointer-events: none;
            transition: opacity 0.3s;
        }

        @media (max-width: 600px) {
            #hint { display: none; }
            #changes { top: auto; bottom: 110px; max-height: 50vh; width: auto; left: 16px; }
            #controls { max-height: 45vh; overflow-y: auto; }
        }
    </style>
</head>

<body>
    <div id="stage">
        <canvas id="gl"></canvas>
        <canvas id="labels"></canvas>
    </div>

    <div id="controls" class="panel">
        <h1>IPv4.pictures</h1>
        <div class="sub">Every /24 of the IPv4 space on a Hilbert curve</div>
        <div class="seg" id="datasets">
            <button data-set="registry">Registry</button>
            <button data-set="cc">Country</button>
            <button data-set="status">Status</button>
        </div>
        <div id="note"></div>
        <div id="legend"></div>
        <div id="meta"></div>
    </div>

    <div id="hint" class="panel">Scroll or pinch to zoom · drag to pan · click to focus · Esc to reset · ← → step months</div>
    <section id="changes" class="panel">
        <div class="head">
            <div class="tabs" role="tablist">
                <button role="tab" data-tab="events" aria-selected="true">Events</button>
                <button role="tab" data-tab="changes" aria-selected="false">Changes</button>
            </div>
            <button class="collapse" aria-label="Collapse panel" aria-expanded="true">▾</button>
        </div>
        <div class="events"></div>
        <div class="since" hidden></div>
        <div class="body" hidden></div>
    </section>
    <div id="timeline" class="panel" hidden>
        <div class="buttons">
            <button id="play" aria-label="Play">▶</button>
            <button id="speed" aria-label="Playback speed">1×</button>
        </div>
        <div class="track">
            <div id="marks"></div>
            <input type="range" id="time" min="0" max="0" step="1" value="0" aria-label="Snapshot date">
        </div>
        <span id="date"></span>
        <div id="years"></div>
        <span id="source"></span>
    </div>
    <div id="tooltip" class="panel"></div>
    <div id="loading">Loading…</div>

    <script>
        'use strict';

        // Start the changes panel collapsed where it would cover the map.
        if (matchMedia('(max-width: 600px)').matches) document.getElementById('changes').classList.add('collapsed');

        // One cell = one /24. Order-12 Hilbert curve => 4096 x 4096 cells = 2^24 /24s.
        const N = 4096;
        const EMPTY = 255; // /24 not listed in the stats
        const SAME = 254;  // in a diff snapshot: unchanged since the previous one

        // xkcd orientation: 0 1 14 15 / 3 2 13 12 / ...
        function xy2d(x, y) {
            let a = x, b = y, d = 0;
            for (let s = N >> 1; s > 0; s >>= 1) {
                const rx = (a & s) ? 1 : 0, ry = (b & s) ? 1 : 0;
                d += s * s * ((3 * rx) ^ ry);
                if (ry === 0) {
                    if (rx === 1) { a = N - 1 - a; b = N - 1 - b; }
                    const t = a; a = b; b = t;
                }
            }
            return d;
        }

        function d2xy(d) {
            let x = 0, y = 0, t = d;
            for (let s = 1; s < N; s *= 2) {
                const rx = 1 & (t / 2), ry = 1 & (t ^ rx);
                if (ry === 0) {
                    if (rx === 1) { x = s - 1 - x; y = s - 1 - y; }
                    const q = x; x = y; y = q;
                }
                x += s * rx; y += s * ry; t = Math.floor(t / 4);
            }
            return [x, y];
        }

        // bbox of [start, end). Aligned 4^k blocks are 2^k squares on the curve.
        function rangeBBox(start, end) {
            let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
            while (start < end) {
                let k = 0;
                while (k < 12 && start % (4 ** (k + 1)) === 0 && start + 4 ** (k + 1) <= end) k++;
                const side = 2 ** k, [x, y] = d2xy(start);
                const bx = x - (x % side), by = y - (y % side);
                x0 = Math.min(x0, bx); y0 = Math.min(y0, by);
                x1 = Math.max(x1, bx + side); y1 = Math.max(y1, by + side);
                start += 4 ** k;
            }
            return { x0, y0, x1, y1 };
        }

        const ip24 = d => `${d >>> 16}.${(d >>> 8) & 255}.${d & 255}`;
        const ipStr = d => `${ip24(d)}.0`;

        function rangeLabel(start, len) {
            const bits = Math.log2(len);
            if (Number.isInteger(bits) && start % len === 0) return `${ipStr(start)}/${24 - bits}`;
            return `${ipStr(start)} – ${ip24(start + len - 1)}.255`;
        }

        const fmtCount = n => {
            const addrs = n * 256;
            if (addrs >= 1e6) return `${(addrs / 1e6).toFixed(addrs >= 1e7 ? 0 : 1)}M`;
            if (addrs >= 1e3) return `${Math.round(addrs / 1e3)}K`;
            return `${addrs}`;
        };

        const regionNames = (() => {
            try { return new Intl.DisplayNames(['en'], { type: 'region' }); } catch { return null; }
        })();

        function hashHue(str) {
            let h = 2166136261;
            for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
            return (h >>> 0);
        }

        function hslToRgb(h, s, l) {
            s /= 100; l /= 100;
            const k = n => (n + h / 30) % 12;
            const a = s * Math.min(l, 1 - l);
            const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
            return [f(0) * 255, f(8) * 255, f(4) * 255];
        }

        const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];

        const DATASETS = {
            registry: {
                file: 'data/registry.bin.gz',
                colors: { arin: '#4cc3ff', ripencc: '#ff9f43', apnic: '#6c7bff', lacnic: '#3ddc84', afrinic: '#ff5d73', iana: '#2a303c' },
                label: n => ({ arin: 'ARIN', ripencc: 'RIPE NCC', apnic: 'APNIC', lacnic: 'LACNIC', afrinic: 'AFRINIC', iana: 'IANA (reserved or unallocated)' }[n] || n),
            },
            status: {
                file: 'data/status.bin.gz',
                colors: {
                    allocated: '#9b6bff', assigned: '#3ddc84', reserved: '#2a303c', available: '#ff5d73',
                    ietf: '#3a4150', ianapool: '#ffc15e',
                },
                // Older snapshots label IANA's own space "ietf" / "ianapool".
                note: 'The NRO file (used from Oct 2019) doesn\'t separate allocations to ISPs from assignments to end users, so both are shown as one.',
                label: n => ({ assigned: 'Allocated or assigned', ianapool: 'IANA pool', available: 'Available (RIR pool)' }[n]
                    || n[0].toUpperCase() + n.slice(1)),
            },
            cc: {
                file: 'data/cc.bin.gz',
                colors: { ZZ: '#2a303c' },
                // rank * golden angle so the big countries don't share a hue
                color: (n, rank) => {
                    const h = hashHue(n);
                    return hslToRgb((rank * 137.508 + 200) % 360, 60 + (h >>> 9) % 25, 50 + (rank % 3) * 7);
                },
                label: n => ({ ZZ: 'No country (reserved or free)', AP: 'Asia/Pacific (unspecified)' }[n]
                    ?? ((regionNames && regionNames.of(n)) || n)),
                legendLimit: 12,
            },
        };

        // retrieve.py FORMAT. After the first snapshot, id 254 means unchanged.
        async function fetchTimeline(file) {
            let bytes = new Uint8Array(await (await fetch(file)).arrayBuffer());
            // Some servers already undo the gzip (Content-Encoding); only inflate if needed.
            if (bytes[0] === 0x1f && bytes[1] === 0x8b) {
                const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
                bytes = new Uint8Array(await new Response(stream).arrayBuffer());
            }
            const view = new DataView(bytes.buffer);
            if (String.fromCharCode(...bytes.subarray(0, 4)) !== 'IP4R' || bytes[4] !== 2) {
                throw new Error(`${file}: unknown format`);
            }
            const headerLen = view.getUint32(5, true);
            const header = JSON.parse(new TextDecoder().decode(bytes.subarray(9, 9 + headerLen)));

            let p = 9 + headerLen;
            const snaps = header.snapshots.map(({ date, runs, ...info }) => {
                const ids = bytes.subarray(p, p + runs);
                p += runs;
                const lens = new Int32Array(runs);
                let pos = 0;
                for (let i = 0; i < runs; i++) {
                    let v = 0, shift = 0, b;
                    do { b = bytes[p++]; v += (b & 0x7f) * 2 ** shift; shift += 7; } while (b & 0x80);
                    lens[i] = v; pos += v;
                }
                if (pos !== N * N) throw new Error(`${file} ${date}: runs cover ${pos} /24s, expected ${N * N}`);
                return { date, ids, lens, ...info };
            });
            return { header, snaps };
        }

        async function loadDataset(key) {
            const def = DATASETS[key];
            const { header, snaps } = await fetchTimeline(def.file);
            const names = header.names; // ids are indices into this, most common (today) first

            const palette = new Uint8Array(256 * 4);
            const rgb = names.map((n, i) => def.colors[n] ? hex(def.colors[n]) : def.color(n, i, names));
            rgb.forEach((c, i) => palette.set([c[0], c[1], c[2], 255], i * 4));

            return {
                key, def, header, names, rgb, palette, snaps,
                linear: new Uint8Array(N * N), totals: new Float64Array(256), snap: -1, baked: -1,
            };
        }

        // Forward applies changed runs only. Going back replays from snapshot 0.
        // changes is [start, length, old id, new id] for the step into k.
        function seek(ds, k) {
            if (k === ds.snap) return;
            const { linear, totals } = ds;
            ds.changes = null;
            if (k < ds.snap || ds.snap < 0) {
                const { ids, lens } = ds.snaps[0];
                totals.fill(0);
                for (let i = 0, pos = 0; i < ids.length; pos += lens[i++]) {
                    linear.fill(ids[i], pos, pos + lens[i]);
                    totals[ids[i]] += lens[i];
                }
                ds.snap = 0;
            }
            for (let s = ds.snap + 1; s <= k; s++) {
                const { ids, lens } = ds.snaps[s];
                const changes = s === k ? [] : null;
                for (let i = 0, pos = 0; i < ids.length; pos += lens[i++]) {
                    if (ids[i] === SAME) continue;
                    for (let j = pos, end = pos + lens[i]; j < end; j++) {
                        const old = linear[j];
                        totals[old]--;
                        if (!changes) continue;
                        // Split the run where the previous category changes.
                        const last = changes[changes.length - 1];
                        if (last && last[2] === old && last[3] === ids[i] && last[0] + last[1] === j) last[1]++;
                        else changes.push([j, 1, old, ids[i]]);
                    }
                    linear.fill(ids[i], pos, pos + lens[i]);
                    totals[ids[i]] += lens[i];
                }
                if (changes) ds.changes = changes;
            }
            ds.snap = k;
        }

        function extentAt(ds, d) {
            const lin = ds.linear, id = lin[d];
            if (id === EMPTY) return null;
            let start = d, end = d + 1;
            while (start > 0 && lin[start - 1] === id) start--;
            while (end < N * N && lin[end] === id) end++;
            return { ds, snap: ds.snap, start, len: end - start, id };
        }

        const glCanvas = document.getElementById('gl');
        const gl = glCanvas.getContext('webgl2', { antialias: false, alpha: false });
        if (!gl) {
            document.getElementById('loading').textContent = 'This page needs WebGL2.';
            throw new Error('WebGL2 unavailable');
        }

        const GLSL_HILBERT = `
            uint xy2d(uint x, uint y) {
                uint a = x, b = y, d = 0u;
                for (uint s = ${N >> 1}u; s > 0u; s >>= 1u) {
                    uint rx = (a & s) > 0u ? 1u : 0u;
                    uint ry = (b & s) > 0u ? 1u : 0u;
                    d += s * s * ((3u * rx) ^ ry);
                    if (ry == 0u) {
                        if (rx == 1u) { a = ${N - 1}u - a; b = ${N - 1}u - b; }
                        uint t = a; a = b; b = t;
                    }
                }
                return d;
            }`;

        const VS = `#version 300 es
            in vec2 p;
            void main() { gl_Position = vec4(p, 0.0, 1.0); }`;

        // curve order -> 4096^2 spatial ids
        const FS_BAKE_IDS = `#version 300 es
            precision highp float; precision highp int; precision highp usampler2D;
            uniform usampler2D uLinear;
            out uint o;
            ${GLSL_HILBERT}
            void main() {
                uint d = xy2d(uint(gl_FragCoord.x), uint(gl_FragCoord.y));
                o = texelFetch(uLinear, ivec2(int(d & ${N - 1}u), int(d >> 12u)), 0).r;
            }`;

        // spatial ids -> 2048^2 colour (2x2), mipmapped when zoomed out
        const FS_BAKE_COLOR = `#version 300 es
            precision highp float; precision highp int; precision highp usampler2D;
            uniform usampler2D uIds;
            uniform sampler2D uPal;
            uniform vec3 uBg;
            out vec4 o;
            vec3 col(ivec2 c) {
                uint id = texelFetch(uIds, c, 0).r;
                vec4 p = texelFetch(uPal, ivec2(int(id), 0), 0);
                return mix(uBg, p.rgb, p.a);
            }
            void main() {
                ivec2 c = ivec2(gl_FragCoord.xy) * 2;
                o = vec4((col(c) + col(c + ivec2(1, 0)) + col(c + ivec2(0, 1)) + col(c + ivec2(1, 1))) * 0.25, 1.0);
            }`;

        // pan/zoom, crossfade between two datasets
        const FS_VIEW = `#version 300 es
            precision highp float; precision highp int; precision highp usampler2D;
            uniform usampler2D uIdsA, uIdsB;
            uniform sampler2D uColA, uColB, uPalA, uPalB;
            uniform float uMix;
            uniform vec2 uView;      // viewport size, device px
            uniform vec2 uCenter;    // view centre, cells
            uniform float uScale;    // device px per cell
            uniform vec3 uBg;
            uniform uvec2 uHover;    // hovered /24 range [start, end), or (0,0)
            out vec4 o;
            ${GLSL_HILBERT}

            uint idAt(usampler2D ids, ivec2 c) {
                if (any(lessThan(c, ivec2(0))) || any(greaterThanEqual(c, ivec2(${N})))) return 255u;
                return texelFetch(ids, c, 0).r;
            }

            vec3 shade(usampler2D ids, sampler2D colTex, sampler2D pal, vec2 g, ivec2 c, vec2 f, float px) {
                // far = mipmapped texture, near = exact cells
                vec3 far = texture(colTex, g / ${N}.0).rgb;
                uint id = idAt(ids, c);
                vec4 p = texelFetch(pal, ivec2(int(id), 0), 0);
                vec3 near = mix(uBg, p.rgb, p.a);

                // 1-device-px borders between different categories, fading in with zoom.
                float edge = 0.0;
                if (f.x < px && idAt(ids, c - ivec2(1, 0)) != id) edge = 1.0;
                if (f.y < px && idAt(ids, c - ivec2(0, 1)) != id) edge = 1.0;
                near = mix(near, uBg, edge * 0.55 * smoothstep(3.0, 10.0, uScale));

                return mix(far, near, smoothstep(0.6, 1.4, uScale));
            }

            void main() {
                vec2 frag = vec2(gl_FragCoord.x, uView.y - gl_FragCoord.y);
                vec2 g = uCenter + (frag - uView * 0.5) / uScale;
                if (any(lessThan(g, vec2(0.0))) || any(greaterThanEqual(g, vec2(${N}.0)))) {
                    o = vec4(uBg, 1.0);
                    return;
                }
                ivec2 c = ivec2(floor(g));
                vec2 f = fract(g);
                float px = 1.0 / uScale;

                vec3 color = uMix >= 1.0 ? shade(uIdsB, uColB, uPalB, g, c, f, px)
                           : mix(shade(uIdsA, uColA, uPalA, g, c, f, px),
                                 shade(uIdsB, uColB, uPalB, g, c, f, px), uMix);

                // /8 and /16 grid
                float grid = 0.0;
                if (f.x < px && c.x % 256 == 0 || f.y < px && c.y % 256 == 0) grid = 0.35 * smoothstep(0.08, 0.3, uScale);
                else if (f.x < px && c.x % 16 == 0 || f.y < px && c.y % 16 == 0) grid = 0.18 * smoothstep(1.5, 5.0, uScale);
                color = mix(color, vec3(1.0), grid);

                if (uHover.y > uHover.x) {
                    uint d = xy2d(uint(c.x), uint(c.y));
                    bool inside = d >= uHover.x && d < uHover.y;
                    color = inside ? mix(color, vec3(1.0), 0.28) : color * 0.72;
                }
                o = vec4(color, 1.0);
            }`;

        function compile(vs, fs) {
            const prog = gl.createProgram();
            for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
                const sh = gl.createShader(type);
                gl.shaderSource(sh, src);
                gl.compileShader(sh);
                if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
                gl.attachShader(prog, sh);
            }
            gl.bindAttribLocation(prog, 0, 'p');
            gl.linkProgram(prog);
            if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
            const u = {};
            for (let i = 0; i < gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS); i++) {
                const name = gl.getActiveUniform(prog, i).name;
                u[name] = gl.getUniformLocation(prog, name);
            }
            return { prog, u };
        }

        const progIds = compile(VS, FS_BAKE_IDS);
        const progColor = compile(VS, FS_BAKE_COLOR);
        const progView = compile(VS, FS_VIEW);

        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

        const BG = [0x0b / 255, 0x0e / 255, 0x14 / 255];

        function makeTex(w, h, internal, format, type, data, filter = gl.NEAREST) {
            const t = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, t);
            gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
            gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, type, data);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            return t;
        }

        function bind(unit, tex) {
            gl.activeTexture(gl.TEXTURE0 + unit);
            gl.bindTexture(gl.TEXTURE_2D, tex);
        }

        function renderTo(tex, w, h, prog) {
            const fb = gl.createFramebuffer();
            gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
            gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
            gl.viewport(0, 0, w, h);
            gl.useProgram(prog);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            gl.deleteFramebuffer(fb);
        }

        function uploadDataset(ds) {
            ds.linTex = makeTex(N, N, gl.R8UI, gl.RED_INTEGER, gl.UNSIGNED_BYTE, null);
            ds.pal = makeTex(256, 1, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, ds.palette);
            ds.idTex = makeTex(N, N, gl.R8UI, gl.RED_INTEGER, gl.UNSIGNED_BYTE, null);
            ds.colTex = makeTex(N / 2, N / 2, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, null, gl.LINEAR_MIPMAP_LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        }

        function bake(ds) {
            bind(0, ds.linTex);
            gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
            gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, N, N, gl.RED_INTEGER, gl.UNSIGNED_BYTE, ds.linear);

            gl.useProgram(progIds.prog);
            gl.uniform1i(progIds.u.uLinear, 0);
            renderTo(ds.idTex, N, N, progIds.prog);

            gl.useProgram(progColor.prog);
            bind(0, ds.idTex);
            bind(1, ds.pal);
            gl.uniform1i(progColor.u.uIds, 0);
            gl.uniform1i(progColor.u.uPal, 1);
            gl.uniform3fv(progColor.u.uBg, BG);
            renderTo(ds.colTex, N / 2, N / 2, progColor.prog);
            bind(0, ds.colTex);
            gl.generateMipmap(gl.TEXTURE_2D);
            ds.baked = ds.snap;
        }

        const view = { cx: N / 2, cy: N / 2, scale: 1 };   // rendered
        const target = { cx: N / 2, cy: N / 2, scale: 1 };
        let dpr = 1, vw = 1, vh = 1, fitScale = 1;
        let current = null, previous = null, mixT = 1, mixStart = 0;
        let hover = null;
        let lastPointer = null;
        let timeIndex = null;       // snapshot index; null = latest
        let playing = false, lastStep = 0;
        const STEP_MS = 160;          // per snapshot at 1×
        const SPEEDS = [1, 2, 4, 8];
        let speed = 1;
        let frameQueued = false;

        const MAX_SCALE = () => 180 * dpr;

        function clampTarget() {
            target.scale = Math.min(MAX_SCALE(), Math.max(fitScale * 0.8, target.scale));
            target.cx = Math.min(N, Math.max(0, target.cx));
            target.cy = Math.min(N, Math.max(0, target.cy));
        }

        function resize() {
            dpr = window.devicePixelRatio || 1;
            vw = Math.round(glCanvas.clientWidth * dpr);
            vh = Math.round(glCanvas.clientHeight * dpr);
            glCanvas.width = labels.width = vw;
            glCanvas.height = labels.height = vh;
            const oldFit = fitScale;
            fitScale = Math.min(vw, vh) / N * 0.94;
            if (view.scale === oldFit || !current) {
                view.scale = target.scale = fitScale;
            }
            requestFrame();
        }

        function resetView() {
            target.cx = N / 2; target.cy = N / 2; target.scale = fitScale;
            requestFrame();
        }

        function requestFrame() {
            if (!frameQueued) { frameQueued = true; requestAnimationFrame(frame); }
        }

        let lastT = performance.now();
        function frame(now) {
            frameQueued = false;
            const dt = Math.min(64, now - lastT); lastT = now;

            // xy linear, scale in log space
            const k = 1 - Math.exp(-dt / 90);
            if (!drag) {
                view.cx += (target.cx - view.cx) * k;
                view.cy += (target.cy - view.cy) * k;
            }
            view.scale = Math.exp(Math.log(view.scale) + (Math.log(target.scale) - Math.log(view.scale)) * k);

            if (inertia && !drag) {
                target.cx -= inertia.vx * dt / view.scale;
                target.cy -= inertia.vy * dt / view.scale;
                inertia.vx *= Math.exp(-dt / 180);
                inertia.vy *= Math.exp(-dt / 180);
                clampTarget();
                if (Math.hypot(inertia.vx, inertia.vy) < 0.01) inertia = null;
            }

            if (previous) {
                mixT = Math.min(1, (now - mixStart) / 350);
                if (mixT >= 1) previous = null;
            }

            // Faster than one snapshot per frame skips ahead; each frame bakes once.
            const step = STEP_MS / speed;
            if (playing && current && now - lastStep >= step) {
                const n = Math.floor((now - lastStep) / step);
                lastStep += n * step;
                const next = snapIndex(current) + n;
                if (next >= current.snaps.length - 1) { setTime(current.snaps.length - 1); setPlaying(false); }
                else setTime(next);
            }
            syncSnapshots();

            draw();
            drawLabels();

            const moving = Math.abs(target.cx - view.cx) * view.scale > 0.1
                || Math.abs(target.cy - view.cy) * view.scale > 0.1
                || Math.abs(Math.log(target.scale / view.scale)) > 1e-4
                || inertia || previous || playing;
            if (moving) requestFrame();
            else { view.cx = target.cx; view.cy = target.cy; view.scale = target.scale; }
        }

        const snapIndex = ds => timeIndex === null ? ds.snaps.length - 1 : Math.min(timeIndex, ds.snaps.length - 1);

        // one bake per dataset per frame
        function syncSnapshots() {
            for (const ds of [current, previous]) {
                if (!ds || ds.baked === snapIndex(ds)) continue;
                seek(ds, snapIndex(ds));
                bake(ds);
                if (ds === current) {
                    renderLegend(ds);
                    renderPanel(ds);
                    if (lastPointer) updateHover(lastPointer.x, lastPointer.y);
                }
            }
        }

        function draw() {
            if (!current) return;
            const a = previous || current, b = current;
            gl.viewport(0, 0, vw, vh);
            gl.useProgram(progView.prog);
            const u = progView.u;
            [[a.idTex, 'uIdsA'], [b.idTex, 'uIdsB'], [a.colTex, 'uColA'], [b.colTex, 'uColB'], [a.pal, 'uPalA'], [b.pal, 'uPalB']]
                .forEach(([tex, name], i) => { bind(i, tex); gl.uniform1i(u[name], i); });
            gl.uniform1f(u.uMix, previous ? mixT * mixT * (3 - 2 * mixT) : 1);
            gl.uniform2f(u.uView, vw, vh);
            gl.uniform2f(u.uCenter, view.cx, view.cy);
            gl.uniform1f(u.uScale, view.scale);
            gl.uniform3fv(u.uBg, BG);
            if (hover) gl.uniform2ui(u.uHover, hover.start, hover.start + hover.len);
            else gl.uniform2ui(u.uHover, 0, 0);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
        }

        const labels = document.getElementById('labels');
        const lctx = labels.getContext('2d');

        const LEVELS = [
            { side: 256, minPx: 34, text: d => `${d >>> 16}` },
            { side: 16, minPx: 52, text: d => `${d >>> 16}.${(d >>> 8) & 255}` },
            { side: 1, minPx: 78, text: d => ip24(d) },
        ];

        function drawLabels() {
            lctx.clearRect(0, 0, vw, vh);
            if (!current) return;

            // finest prefix length big enough to read
            let li = -1;
            for (let i = 0; i < LEVELS.length; i++) if (LEVELS[i].side * view.scale / dpr >= LEVELS[i].minPx) li = i;
            if (li < 0) return;
            const L = LEVELS[li], sizeCss = L.side * view.scale / dpr;
            const alpha = Math.min(1, (sizeCss - L.minPx) / (L.minPx * 0.6));

            const gx0 = view.cx - vw / 2 / view.scale, gy0 = view.cy - vh / 2 / view.scale;
            const bx0 = Math.max(0, Math.floor(gx0 / L.side)), by0 = Math.max(0, Math.floor(gy0 / L.side));
            const bx1 = Math.min(N / L.side - 1, Math.floor((gx0 + vw / view.scale) / L.side));
            const by1 = Math.min(N / L.side - 1, Math.floor((gy0 + vh / view.scale) / L.side));

            const fontPx = Math.max(10, Math.min(26, sizeCss * 0.2)) * dpr;
            lctx.font = `600 ${fontPx}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
            lctx.textAlign = 'center';
            lctx.textBaseline = 'middle';
            lctx.lineJoin = 'round';
            lctx.lineWidth = 3 * dpr;
            lctx.strokeStyle = `rgba(0,0,0,${0.55 * alpha})`;
            lctx.fillStyle = `rgba(255,255,255,${0.9 * alpha})`;

            const mask = ~(L.side * L.side - 1);
            for (let by = by0; by <= by1; by++) {
                for (let bx = bx0; bx <= bx1; bx++) {
                    const d = xy2d(bx * L.side + (L.side >> 1), by * L.side + (L.side >> 1)) & mask;
                    const sx = ((bx + 0.5) * L.side - view.cx) * view.scale + vw / 2;
                    const sy = ((by + 0.5) * L.side - view.cy) * view.scale + vh / 2;
                    const t = L.text(d);
                    lctx.strokeText(t, sx, sy);
                    lctx.fillText(t, sx, sy);
                }
            }
        }

        function renderLegend(ds) {
            const el = document.getElementById('legend');
            // Categories that don't exist in this snapshot (e.g. older status labels) are left out.
            const rows = ds.names.map((n, i) => ({ n, i, total: ds.totals[i] })).filter(r => r.total > 0);
            const shown = ds.def.legendLimit ? rows.slice(0, ds.def.legendLimit) : rows;
            document.getElementById('note').textContent = ds.def.note || '';
            el.innerHTML = '';
            for (const r of shown) {
                const row = document.createElement('div');
                row.className = 'row';
                const [cr, cg, cb] = ds.rgb[r.i];
                row.innerHTML = `<span class="sw" style="background:rgb(${cr | 0},${cg | 0},${cb | 0})"></span>`
                    + `<span class="name"></span><span class="val">${fmtCount(r.total)}</span>`;
                row.querySelector('.name').textContent = ds.def.label(r.n);
                el.appendChild(row);
            }
            // Space no published file covers (e.g. RIRs whose archive hasn't started yet).
            if (ds.totals[EMPTY] >= N * N * 0.001) {
                const row = document.createElement('div');
                row.className = 'row';
                row.innerHTML = `<span class="sw" style="background:var(--bg);box-shadow:inset 0 0 0 1px var(--border)"></span>`
                    + `<span class="name">No data</span><span class="val">${fmtCount(ds.totals[EMPTY])}</span>`;
                el.appendChild(row);
            }
            if (shown.length < rows.length) {
                const more = document.createElement('div');
                more.className = 'row';
                more.style.color = 'var(--muted)';
                more.textContent = `+ ${rows.length - shown.length} more — hover the map`;
                el.appendChild(more);
            }
        }

        const changesEl = document.getElementById('changes');
        let events = [];  // from data/events.json (scripts/events.py)

        fetch('data/events.json').then(r => r.json()).then(d => {
            events = d.events;
            if (current) { renderPanel(current); layoutMarks(current); }
        }).catch(() => {});

        changesEl.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
            changesEl.classList.remove('collapsed');
            changesEl.querySelectorAll('.tabs button').forEach(t => t.setAttribute('aria-selected', t === b));
            changesEl.querySelector('.body').hidden = b.dataset.tab !== 'changes';
            changesEl.querySelector('.since').hidden = b.dataset.tab !== 'changes';
            changesEl.querySelector('.events').hidden = b.dataset.tab !== 'events';
        }));
        changesEl.querySelector('.collapse').addEventListener('click', e => {
            const collapsed = changesEl.classList.toggle('collapsed');
            e.currentTarget.setAttribute('aria-expanded', !collapsed);
        });

        // first snapshot on or after the event date
        const eventSnap = (ds, ev) => {
            const i = ds.snaps.findIndex(s => s.date >= ev.date);
            return i < 0 ? ds.snaps.length - 1 : i;
        };

        function jumpToEvent(ev) {
            if (!current) return;
            setPlaying(false);
            setTime(eventSnap(current, ev));
            focusBlocks(ev.blocks.map(b => [b.start, b.len]));
        }

        const hoverEvent = ev => setHover(ev && current
            ? { ds: current, snap: current.snap, start: ev.blocks[0].start, len: ev.blocks[0].len, id: 0 } : null);

        function renderPanel(ds) {
            renderChanges(ds);
            renderEvents(ds);
            const k = snapIndex(ds), body = changesEl.querySelector('.body');
            for (const ev of events.filter(e => eventSnap(ds, e) === k).reverse()) {
                const row = document.createElement('div');
                row.className = 'event-now';
                row.append(ev.icon, Object.assign(document.createElement('span'), { textContent: ev.title }));
                row.title = ev.detail;
                row.addEventListener('click', () => jumpToEvent(ev));
                row.addEventListener('mouseenter', () => hoverEvent(ev));
                row.addEventListener('mouseleave', () => hoverEvent(null));
                body.prepend(row);
            }
        }

        function renderEvents(ds) {
            const el = changesEl.querySelector('.events');
            el.innerHTML = '';
            if (!events.length) {
                el.innerHTML = '<div class="muted" style="margin-top:8px">No events loaded.</div>';
                return;
            }
            const intro = document.createElement('div');
            intro.className = 'muted';
            intro.style.marginTop = '8px';
            intro.innerHTML = 'From IANA\'s <a>IPv4 registries</a>. Click to jump there.';
            intro.querySelector('a').href = 'https://www.iana.org/assignments/ipv4-address-space';
            intro.querySelector('a').style.color = 'inherit';
            el.appendChild(intro);

            const k = snapIndex(ds), table = document.createElement('table');
            for (const ev of events) {
                const at = eventSnap(ds, ev);
                const tr = document.createElement('tr');
                tr.className = at === k ? 'now' : at > k ? 'future' : '';
                const icon = Object.assign(document.createElement('td'), { className: 'icon', textContent: ev.icon });
                const when = Object.assign(document.createElement('td'), { className: 'when', textContent: fmtDate(ev.date) });
                const what = document.createElement('td');
                what.className = 'what';
                what.append(Object.assign(document.createElement('b'), { textContent: ev.title }),
                    Object.assign(document.createElement('div'), { className: 'detail', textContent: ev.detail }));
                tr.title = ev.detail;
                tr.append(icon, when, what);
                tr.addEventListener('click', () => jumpToEvent(ev));
                tr.addEventListener('mouseenter', () => hoverEvent(ev));
                tr.addEventListener('mouseleave', () => hoverEvent(null));
                table.appendChild(tr);
            }
            el.appendChild(table);
            // keep the current event in view while playing
            if (!el.hidden && !changesEl.classList.contains('collapsed')) {
                const rows = [...table.rows].filter(r => !r.classList.contains('future'));
                rows[rows.length - 1]?.scrollIntoView({ block: 'nearest' });
            }
        }

        function layoutMarks(ds) {
            const marks = document.getElementById('marks'), last = ds.snaps.length - 1;
            marks.innerHTML = '';
            const bySnap = new Map();
            for (const ev of events) {
                const i = eventSnap(ds, ev);
                bySnap.set(i, [...(bySnap.get(i) || []), ev]);
            }
            for (const [i, evs] of bySnap) {
                const dot = document.createElement('button');
                dot.style.left = `calc(${i / last * 100}% + ${8 - 16 * i / last}px)`;
                dot.title = evs.map(e => `${fmtDate(e.date)}  ${e.icon} ${e.title}`).join('\n');
                dot.setAttribute('aria-label', dot.title);
                dot.addEventListener('click', () => jumpToEvent(evs[0]));
                marks.appendChild(dot);
            }
        }

        function swatch(ds, id) {
            const sw = document.createElement('span');
            sw.className = 'sw';
            if (id === EMPTY) sw.style.cssText = 'background:var(--bg);box-shadow:inset 0 0 0 1px var(--border)';
            else sw.style.background = `rgb(${ds.rgb[id].map(c => c | 0).join(',')})`;
            return sw;
        }

        const catName = (ds, id) => id === EMPTY ? 'No data' : ds.def.label(ds.names[id]);

        function transition(ds, from, to) {
            const el = document.createElement('span');
            el.className = 'tr';
            const a = document.createElement('span'), b = document.createElement('span');
            a.textContent = catName(ds, from);
            b.textContent = catName(ds, to);
            el.append(swatch(ds, from), a, ' → ', swatch(ds, to), b);
            return el;
        }

        function sourceNotes(prev, snap) {
            const notes = [];
            if (prev.source === 'rir' && snap.source === 'nro') {
                notes.push('Data switches from rebuilt RIR archives to the NRO file here; some changes come from that.');
            }
            if (prev.source === 'estimated' && snap.source === 'rir') {
                notes.push('First published RIR stats. Earlier years are estimated from allocation dates.');
            }
            if (!prev.rirs || !snap.rirs) return notes; // per-RIR files only exist when rebuilt
            const before = Object.keys(prev.rirs), now = Object.keys(snap.rirs);
            const joined = now.filter(r => !before.includes(r)), left = before.filter(r => !now.includes(r));
            const rirName = r => DATASETS.registry.label(r);
            if (joined.length) notes.push(`${joined.map(rirName).join(', ')} archive starts here.`);
            if (left.length) notes.push(`No ${left.map(rirName).join(', ')} file this month.`);
            const ext = now.filter(r => snap.rirs[r].endsWith('extended') && before.includes(r) && !prev.rirs[r].endsWith('extended'));
            const published = now.filter(r => prev.rirs[r]?.endsWith('estimated') && !snap.rirs[r].endsWith('estimated'));
            if (published.length && snap.source === 'rir' && prev.source === 'rir') {
                notes.push(`${published.map(rirName).join(', ')} published files start here; before, estimated from allocation dates.`);
            }
            if (ext.length) notes.push(`${ext.map(rirName).join(', ')} switches to extended files, which also list free and reserved space.`);
            // Archive gaps: an older file carried forward (see MAX_CARRY in reconstruct.py).
            for (const r of now.filter(r => !snap.rirs[r].endsWith('estimated'))) {
                const fileDate = snap.rirs[r].slice(0, 10);
                if ((Date.parse(snap.date) - Date.parse(fileDate)) / 864e5 > 45) {
                    notes.push(`No recent ${rirName(r)} file; using the one from ${fmtDate(fileDate, true)}.`);
                }
            }
            return notes;
        }

        function renderChanges(ds) {
            const body = changesEl.querySelector('.body');
            const k = snapIndex(ds), snap = ds.snaps[k];
            body.innerHTML = '';
            const head = changesEl.querySelector('.since');
            if (k === 0 || !ds.changes) {
                head.textContent = '';
                body.innerHTML = '<div class="muted">First snapshot, nothing to compare with.</div>';
                return;
            }
            const prev = ds.snaps[k - 1];
            head.textContent = `Compared with ${fmtDate(prev.date, true)}`;

            const changes = ds.changes;
            const total = changes.reduce((n, c) => n + c[1], 0);
            const summary = document.createElement('div');
            summary.className = 'muted';
            summary.textContent = total
                ? `${fmtCount(total)} addresses changed in ${changes.length.toLocaleString()} range${changes.length === 1 ? '' : 's'}.`
                : 'No changes.';
            body.appendChild(summary);

            for (const note of sourceNotes(prev, snap)) {
                const n = document.createElement('div');
                n.className = 'note';
                n.textContent = note;
                body.appendChild(n);
            }
            if (!total) return;

            const byPair = new Map();
            for (const [, len, from, to] of changes) {
                const key = from * 256 + to;
                byPair.set(key, (byPair.get(key) || 0) + len);
            }
            const pairs = [...byPair].sort((a, b) => b[1] - a[1]);
            body.appendChild(Object.assign(document.createElement('h3'), { textContent: 'Biggest shifts' }));
            for (const [key, n] of pairs.slice(0, 6)) {
                const row = document.createElement('div');
                row.className = 'row';
                row.append(transition(ds, key >> 8, key & 255));
                row.appendChild(Object.assign(document.createElement('span'), { className: 'val', textContent: fmtCount(n) }));
                body.appendChild(row);
            }
            if (pairs.length > 6) {
                body.appendChild(Object.assign(document.createElement('div'), {
                    className: 'muted', textContent: `+ ${pairs.length - 6} smaller shifts`,
                }));
            }

            body.appendChild(Object.assign(document.createElement('h3'), { textContent: 'Biggest ranges' }));
            for (const [start, len, from, to] of [...changes].sort((a, b) => b[1] - a[1]).slice(0, 8)) {
                const item = document.createElement('button');
                item.className = 'range';
                const top = document.createElement('span');
                top.className = 'ip';
                top.textContent = rangeLabel(start, len);
                const size = Object.assign(document.createElement('span'), { className: 'val', textContent: fmtCount(len) });
                const line = document.createElement('span');
                line.className = 'row';
                line.append(top, size);
                item.append(line, transition(ds, from, to));
                item.addEventListener('mouseenter', () => setHover({ ds, snap: ds.snap, start, len, id: to }));
                item.addEventListener('mouseleave', () => setHover(null));
                item.addEventListener('click', () => focusRange(start, len));
                body.appendChild(item);
            }
        }

        const stage = document.getElementById('stage');
        const tooltip = document.getElementById('tooltip');
        const pointers = new Map();
        let drag = null, pinch = null, inertia = null, downAt = null;

        function toGrid(clientX, clientY, v = view) {
            return [v.cx + (clientX * dpr - vw / 2) / v.scale, v.cy + (clientY * dpr - vh / 2) / v.scale];
        }

        // zoom around a point; the cell under it stays put
        function zoomAt(clientX, clientY, factor) {
            const [gx, gy] = toGrid(clientX, clientY, target);
            target.scale *= factor;
            clampTarget();
            target.cx = gx - (clientX * dpr - vw / 2) / target.scale;
            target.cy = gy - (clientY * dpr - vh / 2) / target.scale;
            clampTarget();
            requestFrame();
        }

        stage.addEventListener('wheel', e => {
            e.preventDefault();
            const delta = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
            zoomAt(e.clientX, e.clientY, Math.exp(-delta * (e.ctrlKey ? 0.01 : 0.0022)));
        }, { passive: false });

        stage.addEventListener('pointerdown', e => {
            stage.setPointerCapture(e.pointerId);
            pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            inertia = null;
            if (pointers.size === 1) {
                // Start drags from where the view is visibly now, not from the target.
                target.cx = view.cx; target.cy = view.cy;
                drag = { x: e.clientX, y: e.clientY, t: performance.now(), vx: 0, vy: 0 };
                downAt = { x: e.clientX, y: e.clientY };
                stage.classList.add('dragging');
            } else if (pointers.size === 2) {
                const [p, q] = [...pointers.values()];
                pinch = { dist: Math.hypot(p.x - q.x, p.y - q.y) };
                drag = null; downAt = null;
            }
        });

        stage.addEventListener('pointermove', e => {
            if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

            if (pinch && pointers.size === 2) {
                const [p, q] = [...pointers.values()];
                const dist = Math.hypot(p.x - q.x, p.y - q.y);
                zoomAt((p.x + q.x) / 2, (p.y + q.y) / 2, dist / pinch.dist);
                pinch.dist = dist;
                return;
            }

            if (drag) {
                const now = performance.now(), dx = (e.clientX - drag.x) * dpr, dy = (e.clientY - drag.y) * dpr;
                view.cx -= dx / view.scale; view.cy -= dy / view.scale;
                target.cx = view.cx; target.cy = view.cy;
                clampTarget(); view.cx = target.cx; view.cy = target.cy;
                const dt = Math.max(1, now - drag.t);
                drag.vx = 0.8 * (dx / dt) + 0.2 * drag.vx;
                drag.vy = 0.8 * (dy / dt) + 0.2 * drag.vy;
                drag.x = e.clientX; drag.y = e.clientY; drag.t = now;
                requestFrame();
            }
            updateHover(e.clientX, e.clientY);
        });

        function endPointer(e) {
            pointers.delete(e.pointerId);
            if (pointers.size < 2) pinch = null;
            if (drag && pointers.size === 0) {
                if (performance.now() - drag.t < 60) inertia = { vx: drag.vx, vy: drag.vy };
                drag = null;
                stage.classList.remove('dragging');
                requestFrame();
            }
        }

        stage.addEventListener('pointerup', e => {
            const wasClick = downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) < 5 && pointers.size === 1;
            endPointer(e);
            downAt = null;
            if (wasClick) { inertia = null; focusRangeAt(e.clientX, e.clientY); }
        });
        stage.addEventListener('pointercancel', endPointer);
        stage.addEventListener('pointerleave', () => { lastPointer = null; setHover(null); tooltip.style.opacity = 0; });
        stage.addEventListener('dblclick', e => { e.preventDefault(); resetView(); });
        window.addEventListener('keydown', e => {
            if (e.key === 'Escape' || e.key === '0') resetView();
            if (e.key === '+' || e.key === '=') zoomAt(innerWidth / 2, innerHeight / 2, 1.6);
            if (e.key === '-') zoomAt(innerWidth / 2, innerHeight / 2, 1 / 1.6);
            if (e.target === timeSlider || !current) return; // the slider handles its own arrows
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                setPlaying(false);
                setTime(Math.max(0, Math.min(current.snaps.length - 1, snapIndex(current) + (e.key === 'ArrowLeft' ? -1 : 1))));
            }
            if (e.key === ' ' && e.target.tagName !== 'BUTTON') { e.preventDefault(); setPlaying(!playing); }
        });

        function cellAt(clientX, clientY) {
            const [gx, gy] = toGrid(clientX, clientY);
            if (gx < 0 || gy < 0 || gx >= N || gy >= N) return -1;
            return xy2d(Math.floor(gx), Math.floor(gy));
        }

        function setHover(h) {
            if (h?.start !== hover?.start || h?.len !== hover?.len) requestFrame();
            hover = h;
        }

        function rangeAt(d) {
            if (d < 0 || !current) return null;
            // Reuse the last extent while the pointer stays inside it.
            if (hover && hover.ds === current && hover.snap === current.snap && d >= hover.start && d < hover.start + hover.len) return hover;
            return extentAt(current, d);
        }

        function updateHover(clientX, clientY) {
            if (!current || pinch) return;
            lastPointer = { x: clientX, y: clientY };
            const d = cellAt(clientX, clientY);
            const r = rangeAt(d);
            setHover(r);
            if (!r) { tooltip.style.opacity = 0; return; }
            tooltip.innerHTML = `<b></b><div class="ip"></div><div class="ip"></div>`;
            tooltip.children[0].textContent = current.def.label(current.names[r.id]);
            tooltip.children[1].textContent = rangeLabel(r.start, r.len);
            tooltip.children[2].textContent = `${(r.len * 256).toLocaleString()} addresses · you're on ${ipStr(d)}/24`;
            const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
            tooltip.style.left = `${Math.min(clientX + 16, innerWidth - tw - 8)}px`;
            tooltip.style.top = `${Math.min(clientY + 16, innerHeight - th - 8)}px`;
            tooltip.style.opacity = 1;
        }

        function focusRangeAt(clientX, clientY) {
            const r = rangeAt(cellAt(clientX, clientY));
            if (!r) return;
            const b = rangeBBox(r.start, r.start + r.len);
            const s = Math.min(vw / (b.x1 - b.x0), vh / (b.y1 - b.y0)) * 0.6;
            // Clicking a range that's already framed zooms back out a step instead.
            if (Math.abs(Math.log(s / target.scale)) < 0.15) { zoomAt(clientX, clientY, 0.35); return; }
            focusRange(r.start, r.len);
        }

        function focusBlocks(blocks) {
            const boxes = blocks.map(([start, len]) => rangeBBox(start, start + len));
            const b = {
                x0: Math.min(...boxes.map(b => b.x0)), y0: Math.min(...boxes.map(b => b.y0)),
                x1: Math.max(...boxes.map(b => b.x1)), y1: Math.max(...boxes.map(b => b.y1)),
            };
            // floor the box at 4 cells so a tiny range doesn't fill the screen
            const s = Math.min(vw / Math.max(b.x1 - b.x0, 4), vh / Math.max(b.y1 - b.y0, 4)) * 0.6;
            target.cx = (b.x0 + b.x1) / 2;
            target.cy = (b.y0 + b.y1) / 2;
            target.scale = s;
            clampTarget();
            requestFrame();
        }

        const focusRange = (start, len) => focusBlocks([[start, len]]);

        const timeline = document.getElementById('timeline');
        const timeSlider = document.getElementById('time');
        const playBtn = document.getElementById('play');
        const dateEl = document.getElementById('date');

        const fmtDate = (iso, full) => new Date(`${iso}T00:00:00Z`).toLocaleDateString('en-GB',
            { day: full ? 'numeric' : undefined, month: 'short', year: 'numeric', timeZone: 'UTC' });

        function setTime(i) {
            timeIndex = current && i >= current.snaps.length - 1 ? null : i;
            updateTimelineUI();
            requestFrame();
        }

        function setPlaying(on) {
            playing = on;
            if (on && current && snapIndex(current) >= current.snaps.length - 1) setTime(0);
            lastStep = performance.now();
            playBtn.textContent = on ? '❚❚' : '▶';
            playBtn.setAttribute('aria-label', on ? 'Pause' : 'Play');
            requestFrame();
        }

        function updateTimelineUI() {
            if (!current) return;
            const snaps = current.snaps, i = snapIndex(current), last = snaps.length - 1;
            timeSlider.max = last;
            timeSlider.value = i;
            // Monthly snapshots read as "Oct 2019"; the latest one gets its day too.
            dateEl.textContent = fmtDate(snaps[i].date, i === last);
            const src = document.getElementById('source'), rirs = Object.keys(snaps[i].rirs || {});
            const kind = snaps[i].source;
            src.textContent = kind === 'nro' ? 'NRO' : kind === 'estimated' ? 'estimated' : `rebuilt · ${rirs.length} of 5 RIRs`;
            src.title = kind === 'nro' ? 'NRO combined delegated stats'
                : kind === 'estimated' ? 'No RIR stats exist yet: estimated from the allocation dates in the oldest RIR files and IANA\'s /8 table'
                : `Rebuilt from: ${Object.entries(snaps[i].rirs).map(([r, d]) => `${r} ${d}`).join(', ')}`;
            updateHash();
        }

        function buildTimeline(ds) {
            const snaps = ds.snaps, last = snaps.length - 1;
            timeline.hidden = last < 1;
            layoutYears(ds);
            layoutMarks(ds);
            const meta = document.getElementById('meta');
            const firstNro = snaps.find(s => s.source === 'nro');
            const firstRir = snaps.find(s => s.source === 'rir');
            meta.innerHTML = 'Data: <a></a>';
            meta.firstElementChild.href = ds.header.sources.nro;
            meta.firstElementChild.textContent = 'NRO delegated stats';
            if (firstNro && firstNro !== snaps[0]) {
                meta.append(` from ${fmtDate(firstNro.date)}, rebuilt from RIR archives + IANA before that`);
                if (firstRir && firstRir !== snaps[0]) meta.append(`, estimated from allocation dates before ${fmtDate(firstRir.date)}`);
            }
            meta.append(`. ${snaps.length} snapshots, ${fmtDate(snaps[0].date)} – ${fmtDate(snaps[last].date, true)}.`);
        }

        // yearly before 2001, monthly after. Decades, then 5-year, then years,
        // skipping anything that would overlap.
        function layoutYears(ds) {
            const snaps = ds.snaps, last = snaps.length - 1, width = timeSlider.clientWidth;
            const years = document.getElementById('years');
            years.innerHTML = '';
            const starts = snaps.map((s, i) => [i, +s.date.slice(0, 4)]).filter(([i]) => snaps[i].date.endsWith('-01-01'));
            const xOf = i => 8 + (width - 16) * i / last; // the range thumb's centre
            const placed = [];
            for (const every of [10, 5, 1]) {
                for (const [i, year] of starts) {
                    if (year % every || placed.some(p => Math.abs(p - xOf(i)) < 36)) continue;
                    placed.push(xOf(i));
                    const tick = document.createElement('span');
                    tick.textContent = year;
                    tick.style.left = `calc(${i / last * 100}% + ${8 - 16 * i / last}px)`;
                    years.appendChild(tick);
                }
            }
        }

        timeSlider.addEventListener('input', () => { setPlaying(false); setTime(+timeSlider.value); });
        playBtn.addEventListener('click', () => setPlaying(!playing));
        const speedBtn = document.getElementById('speed');
        speedBtn.addEventListener('click', () => {
            speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
            speedBtn.textContent = `${speed}×`;
        });

        // #<dataset> or #<dataset>@<date>
        function updateHash() {
            if (!current || !history.replaceState) return;
            const i = snapIndex(current);
            const hash = `#${current.key}${timeIndex === null ? '' : `@${current.snaps[i].date}`}`;
            if (location.hash !== hash) history.replaceState(null, '', hash);
        }

        function fromHash() {
            const [key, date] = decodeURIComponent(location.hash.slice(1)).split('@');
            return { key: key || 'registry', date };
        }

        const cache = {};
        async function show(key, date) {
            if (!DATASETS[key]) key = 'registry';
            document.querySelectorAll('#datasets button').forEach(b => b.setAttribute('aria-pressed', b.dataset.set === key));
            if (!cache[key]) {
                cache[key] = loadDataset(key).then(ds => { uploadDataset(ds); return ds; });
            }
            const ds = await cache[key];
            if (date) {
                // Nearest snapshot on or before the requested date.
                const i = ds.snaps.findLastIndex(s => s.date <= date);
                timeIndex = i >= 0 && i < ds.snaps.length - 1 ? i : (i < 0 ? 0 : null);
            }
            if (ds !== current) {
                if (current) { previous = current; mixStart = performance.now(); }
                current = ds;
                hover = null;
                buildTimeline(ds);
            }
            // legend updates in syncSnapshots once this snapshot is baked
            if (ds.baked === snapIndex(ds)) { renderLegend(ds); renderPanel(ds); }
            updateTimelineUI();
            document.getElementById('loading').style.opacity = 0;
            requestFrame();
        }

        document.querySelectorAll('#datasets button').forEach(b => b.addEventListener('click', () => show(b.dataset.set)));
        window.addEventListener('resize', () => { resize(); if (current) layoutYears(current); });
        window.addEventListener('hashchange', () => { const h = fromHash(); show(h.key, h.date); });

        resize();
        show(fromHash().key, fromHash().date).catch(err => {
            document.getElementById('loading').textContent = `Failed to load data: ${err.message}`;
            console.error(err);
        });
    </script>
</body>

</html>
